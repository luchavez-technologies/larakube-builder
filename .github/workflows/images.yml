name: Builder images

# Rebuilds a builder image when its base image changed upstream, when its Dockerfile or option list
# changed, or when one of the tools preinstalled in it has a new release. images.json lists the images.
on:
  push:
    branches: [main]
    paths: [.github/workflows/images.yml, php/**, python/**, images.json, scripts/**]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every image even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v5

      - name: List the images
        id: list
        run: echo "images=$(jq -c '.images' images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
        platform: [amd64, arm64]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out what to build
        id: need
        env:
          IMAGE: ${{ toJSON(matrix.image) }}
          REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}:${{ matrix.image.version }}
          FORCE: ${{ inputs.force }}
        run: |
          base="$(jq -r '.base' <<<"$IMAGE")"
          dockerfile="$(jq -r '.dockerfile' <<<"$IMAGE")"

          # The latest release of each preinstalled tool, so a new release rebuilds the image.
          composer_global=""
          for spec in $(jq -r '.composer[]? // empty' <<<"$IMAGE"); do
            name="${spec%%:*}"
            latest="$(curl -fsSL "https://repo.packagist.org/p2/${name}.json" | jq -r --arg n "$name" '.packages[$n][0].version' | sed 's/^v//')"
            constraint="${spec#*:}"; [ "$constraint" = "$spec" ] && constraint="$latest"
            composer_global="$composer_global ${name}:${constraint}"
            tracked="$tracked ${name}=${latest}"
          done
          pip_packages=""
          for name in $(jq -r '.pip[]? // empty' <<<"$IMAGE"); do
            latest="$(curl -fsSL "https://pypi.org/pypi/${name}/json" | jq -r '.info.version')"
            pip_packages="$pip_packages ${name}==${latest}"
            tracked="$tracked ${name}=${latest}"
          done
          {
            echo "composer_global=${composer_global# }"
            echo "pip_packages=${pip_packages# }"
            echo "tracked=${tracked# }"
          } >> "$GITHUB_OUTPUT"

          base_digest="$(docker buildx imagetools inspect "$base" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          recipe="$(printf '%s|%s|%s|%s' "$(cat "$dockerfile")" "$base" "$composer_global" "$pip_packages" | sha256sum | cut -c1-16)"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"

          labels="$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/dev/null || true)"
          published_base="$(jq -r '.. | .["org.opencontainers.image.base.digest"]? // empty' <<<"$labels" 2>/dev/null | head -n1 || true)"
          published_recipe="$(jq -r '.. | .["dev.larakube.builder.recipe"]? // empty' <<<"$labels" 2>/dev/null | head -n1 || true)"
          if [ "$FORCE" = "true" ] || [ "$published_base" != "$base_digest" ] || [ "$published_recipe" != "$recipe" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.need.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.need.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.need.outputs.build == 'true'
        name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: smoke:${{ matrix.image.package }}-${{ matrix.image.version }}
          build-args: |
            BASE_IMAGE=${{ matrix.image.base }}
            COMPOSER_GLOBAL=${{ steps.need.outputs.composer_global }}
            PIP_PACKAGES=${{ steps.need.outputs.pip_packages }}

      - if: steps.need.outputs.build == 'true'
        name: Smoke test
        run: scripts/smoke.sh smoke:${{ matrix.image.package }}-${{ matrix.image.version }} ${{ matrix.image.package }}

      - if: steps.need.outputs.build == 'true'
        name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: |
            BASE_IMAGE=${{ matrix.image.base }}
            COMPOSER_GLOBAL=${{ steps.need.outputs.composer_global }}
            PIP_PACKAGES=${{ steps.need.outputs.pip_packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=${{ matrix.image.base }}
            org.opencontainers.image.base.digest=${{ steps.need.outputs.base_digest }}
            dev.larakube.builder.recipe=${{ steps.need.outputs.recipe }}
            dev.larakube.builder.tools=${{ steps.need.outputs.tracked }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }},push-by-digest=true,name-canonical=true,push=true

      - if: steps.need.outputs.build == 'true'
        name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - if: steps.need.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.package }}-${{ matrix.image.version }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish:
    needs: [matrix, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: digests-${{ matrix.image.package }}-${{ matrix.image.version }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Publish the multi-arch tags
        env:
          NAME: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}
          VERSION: ${{ matrix.image.version }}
        run: |
          shopt -s nullglob
          files=(/tmp/digests/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing was rebuilt for ${NAME}:${VERSION}."
            exit 0
          fi
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          sources=()
          for f in "${files[@]}"; do sources+=("${NAME}@sha256:$(basename "$f")"); done
          date_tag="$(date -u +%Y%m%d)"
          docker buildx imagetools create -t "${NAME}:${VERSION}" -t "${NAME}:${VERSION}-r${date_tag}" "${sources[@]}"
          docker buildx imagetools inspect "${NAME}:${VERSION}"

  # Does not gate anything: tells you when the LaraKube CLI pulls a builder that is not listed here.
  cli-drift:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install the LaraKube CLI
        run: curl -fsSL https://cli.larakube.app/install.sh | bash -s -- --canary

      - name: Compare what the CLI pulls with what is built here
        run: |
          cli="$(larakube workspace:images --json --no-interaction | tail -n1 | jq -r '.builders[] | "\(.runtime):\(.version)"' | sort)"
          here="$(jq -r '.images[] | "\(.package):\(.version)"' images.json | sort)"
          if [ "$cli" != "$here" ]; then
            echo "::warning::The LaraKube CLI and images.json disagree"
            diff <(echo "$cli") <(echo "$here") || true
            exit 1
          fi
